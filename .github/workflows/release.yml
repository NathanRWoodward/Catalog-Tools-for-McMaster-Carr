name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the script version
        run: node scripts/version.mjs check --tag "$GITHUB_REF_NAME"

      - name: Syntax-check the script
        run: node --check mcmaster-catalog-tools.user.js

      - name: Publish the release with the script attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" mcmaster-catalog-tools.user.js
          --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
